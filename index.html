<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de Contenido</title>
<meta name="description" content="Registra lo que subes, programas y produces para TikTok, Instagram, Facebook y YouTube.">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de una columna (máx. 520px) que en pantallas grandes pasa a riel lateral + dos columnas. La rutina genera horarios; cada horario lleva un video con título. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e8ebf0; --ink:#141824; --muted:#5d6475; --line:#dde1e8;
  --cta:#c2410c; --on-cta:#ffffff;
  --warn:#a85d00; --warn-bg:#fff2dc; --ok:#17803f; --ok-bg:#e3f4ea; --bad:#c0262d; --bad-bg:#fde8e8;
  --prog:#3b5bdb; --prog-bg:#e7ecff;
  --tt:#000000; --ig:#E4405F; --fb:#0866FF; --yt:#FF0000;
  --hero:#141824; --on-hero:#ffffff;
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c25; --sunk:#232836; --ink:#eef0f5; --muted:#a1a8b8; --line:#2a303d;
  --cta:#f97316; --on-cta:#1a0a00;
  --warn:#f5a524; --warn-bg:#35270f; --ok:#4ccd7f; --ok-bg:#133022; --bad:#ff7070; --bad-bg:#3a1618;
  --prog:#8ea6ff; --prog-bg:#1c2547;
  --tt:#ffffff; --ig:#ff5f86; --fb:#4b8dff; --yt:#ff4040;
  --hero:#262d3e; --on-hero:#eef0f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#181c25; --sunk:#232836; --ink:#eef0f5; --muted:#a1a8b8; --line:#2a303d;
  --cta:#f97316; --on-cta:#1a0a00;
  --warn:#f5a524; --warn-bg:#35270f; --ok:#4ccd7f; --ok-bg:#133022; --bad:#ff7070; --bad-bg:#3a1618;
  --prog:#8ea6ff; --prog-bg:#1c2547;
  --tt:#ffffff; --ig:#ff5f86; --fb:#4b8dff; --yt:#ff4040;
  --hero:#262d3e; --on-hero:#eef0f5; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cta);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
h3{font-size:16px;font-weight:800}
p{margin:0}
.app{max-width:520px;margin:0 auto}
.muted{color:var(--muted)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg{flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:28px;font-weight:800}
.top .sub{font-size:14px;color:var(--muted);font-weight:500}
#syncLbl[data-st="ok"]{color:var(--ok)}#syncLbl[data-st="offline"]{color:var(--warn)}
.topr{display:flex;align-items:center;gap:8px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:44px;font-weight:700;font-size:14px;color:var(--cta);white-space:nowrap}
.streak span{color:var(--ink)}

.view{display:flex;flex-direction:column;gap:14px;animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.sec h2{font-size:18px;font-weight:800}
.cols{display:flex;flex-direction:column;gap:14px}
.cols>div{display:flex;flex-direction:column;gap:14px;min-width:0}
.cov-grid,.rut-grid{display:flex;flex-direction:column;gap:14px}

[data-net="tt"]{--c:var(--tt)}[data-net="ig"]{--c:var(--ig)}[data-net="fb"]{--c:var(--fb)}[data-net="yt"]{--c:var(--yt)}
.nd{display:inline-grid;place-items:center;width:20px;height:20px;flex:none}
.nd svg{width:100%;height:100%;display:block;overflow:visible}

/* resumen */
.sum{display:flex;flex-direction:column;gap:12px}
.sum .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sum .big b{font-size:40px;font-weight:800;line-height:1}
.sum .big span{font-size:15px;color:var(--muted);font-weight:600}
.seg3{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.seg3 i{display:block;height:100%}
.seg3 .p{background:var(--ok)}.seg3 .q{background:var(--prog)}.seg3 .l{background:var(--bad)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fmtrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmt{background:var(--bg);border-radius:12px;padding:10px 12px}
.fmt b{font-size:20px;font-weight:800}
.fmt div{font-size:13px;color:var(--muted);font-weight:600}

.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:14px 16px}
.alert>svg{color:var(--warn)}
.alert .act{grid-column:2;justify-self:start;margin-top:6px;background:var(--ink);color:var(--bg);border-radius:10px;padding:0 14px;min-height:40px;font-weight:700;font-size:14px}

/* lo próximo */
.next{display:flex;flex-direction:column;gap:10px;background:var(--hero);color:var(--on-hero);border-radius:20px;padding:16px}
.next .lbl{color:color-mix(in srgb,var(--on-hero) 62%,transparent)}
.next .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.next .when{font-size:22px;font-weight:800;line-height:1.1}
.next .cd{font-size:15px;font-weight:800;color:var(--cta);white-space:nowrap}
.next .it{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--on-hero) 9%,transparent);min-height:48px}
.next .it .t{font-weight:800;font-size:15px}
.next .it .t.none{color:var(--cta)}
.next .it .s{font-size:12.5px;opacity:.75;font-weight:600;margin-top:-4px}
.next .go2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--cta);color:var(--on-cta);font-weight:800;font-size:15.5px;padding:0 16px}
.next .okline{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ok);min-height:40px}
.nowline{display:flex;align-items:center;gap:10px;color:var(--cta);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nowline::before,.nowline::after{content:"";flex:1;height:2px;background:var(--cta);border-radius:1px;opacity:.7}
.tmr{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:64px}
.tmr b{font-size:20px;font-weight:800}

/* tarjetas de horario */
.tgroup{display:flex;flex-direction:column;gap:8px}
.thead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-top:4px}
.thead .muted{font-weight:600;font-size:13px}
.slot{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:76px}
.slot.late{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.slot.part{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.slot .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;text-align:left}
.slot .vt{font-weight:800;font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot .vt.none{color:var(--muted);font-weight:700;font-style:italic}
.slot .vt.need{color:var(--warn)}
.slot .sr{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:-2px}
.kind{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 6px;flex:none}
.nets{display:flex;flex-wrap:wrap;gap:6px}
.ns{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:9px;padding:5px 8px 5px 6px;background:var(--sunk);color:var(--muted)}
.ns svg{width:14px;height:14px}
.ns .nd{width:15px;height:15px}
.ns.pub{background:var(--ok-bg);color:var(--ok)}
.ns.prog{background:var(--prog-bg);color:var(--prog)}
.ns.late{background:var(--bad-bg);color:var(--bad)}
.qa{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;font-weight:700;font-size:13.5px;flex:none;background:var(--sunk);text-align:center;line-height:1.15}
.qa.go{background:var(--ok-bg);color:var(--ok)}
.qa.pr{background:var(--prog-bg);color:var(--prog)}
.st{font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;flex:none;white-space:nowrap}
.st.pub{background:var(--ok-bg);color:var(--ok)}.st.prog{background:var(--prog-bg);color:var(--prog)}
.st.res,.st.asig{background:var(--warn-bg);color:var(--warn)}.st.late,.st.part{background:var(--bad-bg);color:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* semana */
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wknav b{font-size:16px}
.ib{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:80px}
.day .d{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .n{font-size:18px;font-weight:800;line-height:1.1}
.day .mb{width:100%;max-width:34px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.day .mb i{display:block;height:100%}
.day .lg{font-size:10px;font-weight:800;color:var(--muted);min-height:13px}
.day.today .n{color:var(--cta)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-pressed="true"] .d,.day[aria-pressed="true"] .n,.day[aria-pressed="true"] .lg{color:var(--bg)}
.day[aria-pressed="true"] .mb{background:color-mix(in srgb,var(--bg) 30%,transparent)}
.ntable{display:flex;flex-direction:column;gap:12px}
.nrow .hd{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;margin-bottom:5px}
.nrow .hd span:first-child{display:flex;align-items:center;gap:8px}
.scroll{overflow-x:auto;margin-inline:-4px}
table.mx{width:100%;border-collapse:separate;border-spacing:4px}
.mx th{font-weight:700;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.2}
.mx th.today{color:var(--cta)}
.mx tbody th{text-align:left;color:var(--ink);font-size:13px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.mc{display:grid;place-items:center;width:100%;min-width:38px;height:42px;border-radius:10px;font-weight:800;font-size:12.5px;background:var(--sunk);color:var(--muted)}
.mc.pub{background:var(--ok-bg);color:var(--ok)}.mc.prog{background:var(--prog-bg);color:var(--prog)}.mc.part{background:var(--warn-bg);color:var(--warn)}.mc.late{background:var(--bad-bg);color:var(--bad)}.mc.pend{background:transparent;border:1.5px dashed var(--line)}.mc.off{background:transparent;color:var(--line)}

/* videos */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 14px;min-height:52px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);min-height:50px;outline:none}
.search:focus-within{border-color:var(--cta)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.row::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14.5px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 12%,var(--surface))}
.chip .cnt{font-size:12px;color:var(--muted);font-weight:800}
.chip.sq{min-width:44px;justify-content:center;padding:0 8px}
.vgroup{display:flex;flex-direction:column;gap:8px}
.vgh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;margin-top:6px}
.vlist-grid{display:grid;gap:8px}
.vrow{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.vrow.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.vrow.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.vrow .top2{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.vrow .vt{font-weight:800;font-size:15.5px;line-height:1.3}
.vrow .vm{font-size:13px;color:var(--muted);font-weight:600}
.vrow .vm b{color:var(--warn)}
mark{background:color-mix(in srgb,var(--cta) 25%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* cobertura */
.cv{display:flex;flex-direction:column;gap:12px}
.cv .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cv .hd b{font-size:17px}
.cvn{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;align-items:center}
.cvn .who{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
.cvn .txt{grid-column:2;font-size:12.5px;color:var(--muted);margin-top:-2px}
.cvn .txt.w{color:var(--warn);font-weight:700}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.strip i{height:18px;border-radius:4px;background:var(--sunk)}
.strip i.pub{background:var(--ok)}.strip i.prog{background:var(--prog)}
.strip i.pend{background:transparent;border:1.5px dashed var(--warn)}
.fill{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14.5px}
.stock{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:14px;padding:12px 14px}
.stock .n{font-size:26px;font-weight:800;line-height:1}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* rutina */
.serie{display:flex;flex-direction:column;gap:12px}
.inp{width:100%;min-height:48px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:0 14px;font:inherit;font-size:16px}
.inp.name{font-weight:800;font-size:17px}
textarea.inp{padding:12px 14px;min-height:120px;line-height:1.5;resize:vertical}
textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:96px}
.timechip{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:12px;padding-left:12px;font-weight:700;min-height:44px}
.timechip button{display:grid;place-items:center;width:40px;height:44px;color:var(--muted)}
.addline{display:flex;gap:8px;align-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.st3 button[aria-pressed="true"][data-v="pub"]{color:var(--ok)}
.seg.st3 button[aria-pressed="true"][data-v="prog"]{color:var(--prog)}
.danger{color:var(--bad);font-weight:700;min-height:44px;padding:0 4px;align-self:flex-start}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:12px;background:var(--sunk);font-weight:700;font-size:15px}
.ghost.accent{background:color-mix(in srgb,var(--cta) 14%,var(--surface));color:var(--cta)}
.permin{font-size:13px;color:var(--muted);font-weight:600}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:520px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--cta)}
.tab .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:11px;display:grid;place-items:center;padding:0 5px}
.fab{justify-self:center;width:58px;height:58px;border-radius:18px;background:var(--cta);color:var(--on-cta);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--cta) 70%,transparent);transition:transform .15s ease}
.fab:active{transform:translateY(-12px) scale(.96)}

/* hojas */
dialog.sheet{margin:auto auto 0;width:100%;max-width:520px;max-height:92dvh;border:0;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink);padding:0;overflow:hidden}
dialog.sheet[open]{display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
dialog.sheet::backdrop{background:rgba(8,10,16,.5)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.shd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:8px 16px 4px}
.shd h2{font-size:20px;font-weight:800}
.shd .muted{font-size:14px}
.sbody{overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;flex:none}
.field{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.netset{display:flex;flex-direction:column;gap:10px}
.netset .row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center}
.netset .who{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
.primary{flex:1;min-height:54px;border-radius:14px;background:var(--cta);color:var(--on-cta);font-weight:800;font-size:16.5px;padding:0 16px}
.primary:disabled{opacity:.45}
.qbtn{min-height:48px;border-radius:12px;font-weight:800;font-size:14.5px}
.qbtn.pr{background:var(--prog-bg);color:var(--prog)}.qbtn.go{background:var(--ok-bg);color:var(--ok)}
.bsum{background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14.5px}
.bsum b{font-size:22px;font-weight:800}
.vbox{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:14px;padding:12px}
.vbox .cur{display:flex;gap:8px;align-items:center}
.vpick{display:flex;flex-direction:column;gap:6px}
.vpick button{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:700;font-size:14.5px}
.vpick button small{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;font-size:14.5px}
.check input{width:22px;height:22px;accent-color:var(--cta);flex:none}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:min(488px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;font-weight:600;font-size:14.5px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.toast button{min-height:40px;padding:0 12px;border-radius:10px;font-weight:800;color:var(--cta);flex:none}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;background:var(--sunk);border-radius:12px;padding:8px 8px 8px 14px}
.exbar button{min-height:40px;padding:0 12px;font-weight:700;text-decoration:underline;flex:none}

005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077", "fb": "M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z", "yt": "M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"};
function logo(n){const p=LOGO_D[n];
  if(n==='tt')return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p}" fill="#25F4EE" transform="translate(-.9 -.7)"/><path d="${p}" fill="#FE2C55" transform="translate(.9 .7)"/><path d="${p}" fill="var(--tt)"/></svg>`;

/* ---------- datos ---------- */
function defaultSeries(){return [
  {id:'mc',name:'Mente Compuesta',kind:'corto',nets:['tt','ig','fb','yt'],days:[0,1,2,3,4,5,6],times:['09:00','16:00']},
  {id:'ai',name:'Archivo Improbable',kind:'corto',nets:['tt','fb','yt'],days:[0,1,2,3,4,5,6],times:['09:00','16:00']},
  {id:'lg',name:'Videos largos',kind:'largo',nets:['yt','fb'],days:[1,3,5],times:['16:00']}
]}
const EXT={
  mc:['Por qué procrastinas aunque quieras avanzar','El interés compuesto de los hábitos','La regla de los 2 minutos','Tu cerebro odia la incertidumbre','Disciplina no es fuerza de voluntad','El sesgo que te hace gastar de más','Cómo piensa alguien constante','El efecto Zeigarnik','Por qué te comparas tanto','La trampa de la motivación','Pequeñas victorias diarias','El costo de no decidir','Dormir mejor en 3 pasos','Qué es la fatiga de decisión','La mentira de la multitarea','El poder de decir no','Ansiedad: 3 señales tempranas','Leer 10 páginas al día','El sesgo de confirmación','Hábitos ancla','Cómo dejar el celular de noche','Por qué olvidas lo que lees'],
  ai:['La carta que llegó 50 años tarde','El objeto más raro de un museo','La isla que no existía','Un misterio sin resolver de 1962','El pueblo que desapareció en una noche','La foto que nadie puede explicar','El reloj que nunca se detuvo','La biblioteca escondida bajo un río','El mapa que dibujó un niño','El faro sin farero','La señal de radio de 1977','El diario encontrado en una pared','El hombre que vivió en un aeropuerto','La moneda imposible','El tren que nunca llegó','La campana del fondo del lago'],
  lg:['Cómo construir hábitos que duran (guía completa)','Los 10 misterios más extraños del siglo XX','Psicología del dinero: lo que nadie te enseñó','Por qué nos sabotea el perfeccionismo','Mi sistema para producir 30 videos al mes']
};
function seed(){
  const series=defaultSeries(), marks={}, videos=[], t=sod(new Date()), now=new Date(), idx={mc:0,ai:0,lg:0};
  const mkV=(sid,ageD)=>{const title=EXT[sid][idx[sid]++%EXT[sid].length];const v={id:uid(),sid,title,at:dkey(addDays(t,-ageD))+'T10:00',ex:true};videos.push(v);return v};
  for(let o=-4;o<=4;o++){
    const d=addDays(t,o),k=dkey(d);
    for(const s of series){ if(!s.days.includes(di(d))) continue;
      s.times.forEach(tm=>{
        const at=P(k+'T'+tm), past=at<=now, key=s.id+'|'+k+'|'+tm;
        const put=(nets,v)=>{marks[key]={v:mkV(s.id,Math.max(1,3-o)).id,n:Object.fromEntries(nets.map(n=>[n,v]))}};
        if(past){put(s.id==='ai'&&o===-2&&tm==='16:00'?['tt','yt']:s.nets,'pub');return}
        if(s.id==='mc'&&o<=3) put(o<=1?s.nets:['tt','fb','yt'],'prog');
        else if(s.id==='ai'&&o<=1) put(o===1&&tm==='16:00'?['tt']:s.nets,'prog');
        else if(s.id==='lg'&&o<=2) put(s.nets,'prog');
      });
    }
  }
  mkV('mc',12); mkV('mc',2); mkV('mc',1); mkV('ai',5); mkV('lg',3);
  return {series,marks,videos,ex:true};
}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){saveLocal()}
let S=load()||seed();
if(!S._ts)S._ts={};
/* migra datos de la versión anterior: temas escritos → videos; reserva numérica → videos sin título */
if(!S.videos){S.videos=[];
  for(const [key,m] of Object.entries(S.marks||{})){if(m.t&&m.t.trim()){const v={id:uid(),sid:key.split('|')[0],title:m.t.trim(),at:key.split('|')[1]+'T08:00'};S.videos.push(v);m.v=v.id}delete m.t;delete m.u}
  S.series.forEach(s=>{for(let i=0;i<(s.stock||0);i++)S.videos.push({id:uid(),sid:s.id,title:'Video editado sin título '+(i+1),at:nowISO()});delete s.stock});
  save();
}

/* ---------- lógica ---------- */
const ser=id=>S.series.find(s=>s.id===id);
const vid=id=>id?S.videos.find(v=>v.id===id):null;
function slotFromKey(key){const [sid,k,tm]=key.split('|');const s=ser(sid);if(!s)return null;return {s,k,tm,key,at:P(k+'T'+tm),si:S.series.indexOf(s)}}
function slotsOn(k){
  const d=K2D(k), out=[];
  S.series.forEach((s,si)=>{if(s.days.includes(di(d)))s.times.forEach(tm=>out.push({s,k,tm,key:s.id+'|'+k+'|'+tm,at:P(k+'T'+tm),si}))});
  return out.sort((a,b)=>a.tm<b.tm?-1:a.tm>b.tm?1:a.si-b.si);
}
function nst(sl,n){const v=S.marks[sl.key]?.n?.[n];const past=sl.at<=new Date();if(v==='pub')return 'pub';if(v==='prog')return past?'pub':'prog';return past?'late':'pend'}
function sst(sl){const st=sl.s.nets.map(n=>nst(sl,n));if(st.every(x=>x==='pub'))return 'pub';if(st.every(x=>x==='pub'||x==='prog'))return 'prog';if(st.some(x=>x==='pub'||x==='prog'))return 'part';return st[0]==='late'?'late':'pend'}
const mk=key=>S.marks[key]||(S.marks[key]={n:{}});
function setN(sl,n,v){const m=mk(sl.key);if(v==='pend'||v==='late')delete m.n[n];else m.n[n]=v}
function count(slots){const c={pub:0,prog:0,pend:0,late:0,tot:0};for(const sl of slots)for(const n of sl.s.nets){c[nst(sl,n)]++;c.tot++}return c}
function futureSlots(days){const out=[];const now=new Date();for(let i=0;i<days;i++)for(const sl of slotsOn(dkey(addDays(sod(now),i))))if(sl.at>now)out.push(sl);return out}
function vmap(){const m={};for(const [k,x] of Object.entries(S.marks))if(x.v)m[x.v]=k;return m}
function reserve(sid){const m=vmap();return S.videos.filter(v=>v.sid===sid&&!m[v.id]).sort((a,b)=>a.at<b.at?-1:1)}
function vStatus(v,m){const key=(m||vmap())[v.id];if(!key)return {st:'res'};const sl=slotFromKey(key);if(!sl)return {st:'res'};const s=sst(sl);return {st:s==='pend'?'asig':s,sl}}
const VLBL={res:'Sin horario',asig:'Falta programar',prog:'Programado',pub:'Subido',part:'Incompleto',late:'No se subió'};
function assignNext(sl){const m=mk(sl.key);if(vid(m.v))return null;const r=reserve(sl.s.id)[0];if(!r)return null;m.v=r.id;return r}
function coverage(s){
  const fut=futureSlots(14).filter(x=>x.s.id===s.id);
  const per=s.nets.map(n=>{const gapI=fut.findIndex(sl=>nst(sl,n)==='pend');return {n,gap:gapI<0?null:fut[gapI],ahead:gapI<0?fut.length:gapI,strip:fut.slice(0,Math.min(fut.length,s.kind==='largo'?6:14)).map(sl=>nst(sl,n))}});
  const worst=[...per].sort((a,b)=>a.ahead-b.ahead)[0];
  const pend7=fut.filter(sl=>sl.at<addDays(sod(new Date()),7)).reduce((a,sl)=>a+s.nets.filter(n=>nst(sl,n)==='pend').length,0);
  return {s,per,worst,pend7,fut};
}
const gapTxt=g=>g?relDay(g.at)+' · '+fT(g.tm):'';
function streak(){let n=0,d=sod(new Date());const full=k=>{const sl=slotsOn(k);return sl.length&&sl.every(x=>sst(x)==='pub')};
  if(!full(dkey(d)))d=addDays(d,-1);while(n<400&&full(dkey(d))){n++;d=addDays(d,-1)}return n}
function nextSlot(){const now=new Date();for(let i=0;i<3;i++)for(const sl of slotsOn(dkey(addDays(sod(now),i))))if(sl.at>now)return sl;return null}
function untilTxt(at){const m=Math.max(1,Math.round((at-new Date())/6e4));if(m<60)return 'en '+m+' min';const h=Math.floor(m/60),r=m%60;return h<24?'en '+h+' h'+(r?' '+r+' min':''):relDay(at)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function forgotten(){const m=vmap();return S.videos.filter(v=>{const x=vStatus(v,m);return (x.st==='res'&&ageDays(v.at)>=3)||x.st==='late'||(x.st==='part'&&x.sl.at<=new Date())})}

const fmtStamp=iso=>{const d=new Date(iso);return dayName(d)+' de '+MON[d.getMonth()]+' · '+pad(d.getHours())+':'+pad(d.getMinutes())};
function backupAge(){return S.lastExport?Math.floor((Date.now()-new Date(S.lastExport))/864e5):null}
function lastBackupTxt(){const a=backupAge();if(a===null)return 'Todavía no has exportado ningún respaldo.';return (a===0?'Hoy':a===1?'Ayer':'Hace '+a+' días')+' · '+fmtStamp(S.lastExport)}
function bkBar(){if(S.ex)return '';const a=backupAge();const need=a===null?S.videos.length>=5:a>=7;if(!need)return '';
  return `<div class="exbar"><span>${a===null?'Aún no tienes un respaldo de tus datos.':'Hace '+a+' días que no exportas un respaldo.'}</span><button type="button" data-bk="export">Exportar</button></div>`}
async function exportData(){
  const now=new Date(); const name='radar-respaldo-'+dkey(now)+'.json';
  const txt=JSON.stringify({app:'radar',version:1,exportedAt:now.toISOString(),data:Object.assign({},S,{lastExport:now.toISOString()})});
  const mark=()=>{S.lastExport=now.toISOString();save();render()};
  let file=null; try{file=new File([txt],name,{type:'application/json'})}catch(e){}
  try{
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){
      await navigator.share({files:[file],title:'Respaldo de Radar'});mark();toast('Respaldo enviado');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);mark();toast('Respaldo descargado: '+name);
}
function readImport(file){
  const r=new FileReader();
  r.onload=()=>{try{let o=JSON.parse(r.result);const meta=o&&o.app==='radar'?o:null;if(meta)o=o.data;
      if(!o||!Array.isArray(o.series)||typeof o.marks!=='object'||!o.marks)throw 0;if(!Array.isArray(o.videos))o.videos=[];
      IMP={data:o,when:meta&&meta.exportedAt?fmtStamp(meta.exportedAt):'(sin fecha)',nv:o.videos.length};
      if(VIEW!=='rutina')nav('rutina');else render();
      setTimeout(()=>document.getElementById('datos')?.scrollIntoView({block:'center',behavior:'smooth'}),50)}
    catch(err){toast('Ese archivo no es un respaldo de Radar.')}};
  r.readAsText(file);
}

const sheetReg=document.getElementById('sheetBatch'); let R=null;
function endOfWeek(){return addDays(monday(new Date()),6)}
const linesOf=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);
function defaultSid(){const nx=nextSlot();return nx?nx.s.id:S.series[0]?.id}
function openReg(pre){
  R=Object.assign({mode:'one',sid:defaultSid(),vid:null,title:'',what:'pub',slot:null,pin:null,off:[],text:'',until:'week',date:dkey(endOfWeek()),assign:true,mwhat:'prog'},pre||{});

  if(R.until==='week'&&dkey(new Date())===dkey(endOfWeek())) R.until='7';
  drawReg(); sheetReg.showModal();
}
function regSlots(){
  const now=new Date(); let out=[];
  if(R.what==='pub'){for(const o of [-1,0,1])for(const sl of slotsOn(dkey(addDays(sod(now),o))))if(sl.s.id===R.sid&&sst(sl)!=='pub')out.push(sl);out.sort((a,b)=>Math.abs(a.at-now)-Math.abs(b.at-now))}
  else out=futureSlots(14).filter(sl=>sl.s.id===R.sid&&!vid(S.marks[sl.key]?.v)&&sst(sl)!=='pub');
  if(R.pin){const p=slotFromKey(R.pin);if(p&&p.s.id===R.sid&&!out.some(x=>x.key===p.key))out.unshift(p)}
  return out.slice(0,8);
}
function batchUntil(){const t=sod(new Date());return R.until==='tom'?addDays(t,1):R.until==='week'?endOfWeek():R.until==='7'?addDays(t,6):K2D(R.date)}
function batchTargets(){
  const out=[], now=new Date(), end=batchUntil();
  for(let d=sod(now);d<=end;d=addDays(d,1)) for(const sl of slotsOn(dkey(d))){
    if(sl.at<=now||!R.sids.includes(sl.s.id)) continue;
    for(const n of sl.s.nets) if(!R.off.includes(n)&&nst(sl,n)==='pend') out.push([sl,n]);
  }
  return out;
}
function regLabel(){
  if(R.mode==='one'){
    const s=ser(R.sid); const n=s?s.nets.filter(x=>!R.off.includes(x)).length:0;
    const has=R.vid||R.title.trim();
    const ok=has&&(R.what==='prod'||(R.slot&&n));
    const txt=R.what==='prod'?'Guardar en producidos':(R.what==='pub'?'Marcar subido':'Marcar programado')+' en '+n+(n===1?' red':' redes');
    return [!!ok,has?txt:'Escribe o elige el video'];
  }
  const lines=linesOf(R.text), one=R.sids.length===1;
  if(R.mwhat==='prod') return [!!(lines.length&&one),lines.length?'Guardar '+lines.length+(lines.length===1?' video':' videos')+' en producidos':'Pega al menos un título'];
  const tg=batchTargets().length;
  return [!!(tg||(lines.length&&one)),tg?'Marcar '+tg+' publicaciones como programadas':lines.length?'Guardar títulos':'No hay nada pendiente'];
}

    let v=vid(R.vid); if(!v){const t=R.title.trim();if(!t)return;v={id:uid(),sid:R.sid,title:t,at:nowISO()};S.videos.push(v)}
    let msg='Guardado en producidos: «'+v.title+'»';
    if(R.what!=='prod'){const sl=slotFromKey(R.slot);if(!sl)return;const prev=vmap()[v.id];if(prev&&prev!==sl.key)delete S.marks[prev].v;mk(sl.key).v=v.id;sl.s.nets.forEach(n=>{if(!R.off.includes(n))setN(sl,n,R.what)});
      msg=(R.what==='pub'?'Subido: «':'Programado: «')+v.title+'» · '+gapTxt(sl)}
    save();sheetReg.close();render();toast(msg,restore(s0));return;
  }
  const lines=R.sids.length===1?linesOf(R.text):[]; const t0=nowISO();
  lines.forEach(t=>S.videos.push({id:uid(),sid:R.sids[0],title:t,at:t0}));
  if(R.mwhat==='prod'){save();sheetReg.close();render();toast(lines.length+(lines.length===1?' video guardado':' videos guardados')+' en producidos',restore(s0));return}
  const tg=batchTargets();let a=0;tg.forEach(([sl,n])=>setN(sl,n,'prog'));
  if(R.assign){[...new Map(tg.map(([sl])=>[sl.key,sl])).values()].sort((x,y)=>x.at-y.at).forEach(sl=>{if(assignNext(sl))a++})}
  save();sheetReg.close();render();toast((tg.length?tg.length+' publicaciones programadas':lines.length+' videos guardados')+(a?' · '+a+' videos asignados':''),restore(s0));
}
document.getElementById('fab').innerHTML=ic('plus',30,2.6);
document.getElementById('fab').onclick=()=>openReg();

/* ---------- hoja: detalle de un video ---------- */
const sheetVid=document.getElementById('sheetVid'); let VM=null;
function openVid(id){VM={id,del:false};drawVid();sheetVid.showModal()}
function drawVid(){
  const v=vid(VM.id); if(!v){sheetVid.close();return}
  const s=vStatus(v); const sr=ser(v.sid);
  const free=futureSlots(14).filter(sl=>sl.s.id===v.sid&&!vid(S.marks[sl.key]?.v)).slice(0,6);
  sheetVid.innerHTML=`<div class="grab"></div>
    <div class="shd"><div><h2 id="vidTitle">Video</h2><div class="muted">${sr?esc(sr.name):''} · agregado ${relDay(P(v.at))}</div></div><button class="ib" style="border:0;background:var(--sunk)" data-close aria-label="Cerrar" type="button">${ic('x')}</button></div>
    <div class="sbody">
      <div class="field"><label class="lbl" for="dtitle">Título</label><input class="inp" id="dtitle" value="${esc(v.title)}" autocomplete="off" enterkeyhint="done"></div>
      <div class="vbox"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="st ${s.st}">${VLBL[s.st]}</span>${s.sl?`<span class="permin">${cap(relDay(s.sl.at))} · ${fT(s.sl.tm)}</span>`:''}</div>
        ${s.sl?`<span class="nets">${netBadges(s.sl)}</span><div class="two"><button type="button" class="ghost" data-openslot="${s.sl.key}">Ver horario</button><button type="button" class="ghost" data-vun>Quitar del horario</button></div>`
        :`${free.length?`<span class="hint">Ponerlo en un horario libre:</span><div class="vpick">${free.map(sl=>`<button type="button" data-vto="${sl.key}">${cap(relDay(sl.at))} · ${fT(sl.tm)}<small>${sst(sl)==='pend'?'sin programar':'ya programado'}</small></button>`).join('')}</div>`:'<span class="hint">No hay horarios libres en las próximas 2 semanas.</span>'}`}
      </div>
      <button type="button" class="danger" data-vdel>${VM.del?'Toca otra vez para eliminar este video':'Eliminar video'}</button>
    </div>
    <div class="sfoot"><button type="button" class="primary" data-close>Listo</button></div>`;
  hydrate(sheetVid);
}
sheetVid.addEventListener('input',e=>{if(e.target.id==='dtitle'){const v=vid(VM.id);if(v){v.title=e.target.value;save()}}});
sheetVid.addEventListener('click',e=>{
  if(e.target===sheetVid){sheetVid.close();return}
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if('close' in d){sheetVid.close();return}
  if(d.openslot){sheetVid.close();openSlot(d.openslot);return}
  if('vun' in d){const key=vmap()[VM.id];if(key)delete S.marks[key].v;save();drawVid();render();return}
  if(d.vto){mk(d.vto).v=VM.id;save();drawVid();render();toast('Asignado a '+gapTxt(slotFromKey(d.vto)));return}
  if('vdel' in d){if(!VM.del){VM.del=true;drawVid();return}const s0=snap();const key=vmap()[VM.id];if(key)delete S.marks[key].v;S.videos=S.videos.filter(v=>v.id!==VM.id);save();sheetVid.close();render();toast('Video eliminado',restore(s0))}
});
sheetVid.addEventListener('close',()=>render());

/* ---------- clics en vistas ---------- */
V.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.slot) openSlot(d.slot);
  else if(d.vid) openVid(d.vid);
  else if(d.q){const i=d.q.indexOf('|');const v=d.q.slice(0,i),key=d.q.slice(i+1);const sl=slotFromKey(key);if(!sl)return;const s0=snap();sl.s.nets.forEach(n=>{const x=nst(sl,n);if(v==='pub'?x!=='pub':x==='pend')setN(sl,n,v)});assignNext(sl);save();render();const t=vid(S.marks[key]?.v);toast((v==='pub'?'Subido: ':'Programado: ')+(t?'«'+t.title+'»':sl.s.name+' '+fT(sl.tm)),restore(s0))}
  else if(d.qg){const [v,k,tm]=d.qg.split('|');const s0=snap();slotsOn(k).filter(x=>x.tm===tm).forEach(sl=>{sl.s.nets.forEach(n=>{if(nst(sl,n)==='pend')setN(sl,n,v)});assignNext(sl)});save();render();toast('Listo: todo lo de las '+fT(tm)+' programado',restore(s0))}
  else if(d.late){const s0=snap();let c=0;slotsOn(d.late).forEach(sl=>{sl.s.nets.forEach(n=>{if(nst(sl,n)==='late'){setN(sl,n,'pub');c++}});assignNext(sl)});save();render();toast(c+' publicaciones marcadas como subidas',restore(s0))}
  else if(d.goday){SEL=d.goday;WEEK=monday(K2D(d.goday));nav('semana')}
  else if(d.vfilter){VF=d.vfilter;VS='all';VQ='';nav('videos')}
  else if(d.vf){VF=d.vf;render()}
  else if(d.vs){VS=d.vs;render()}
  else if(d.bk){
    if(d.bk==='export') exportData();
    else if(d.bk==='import') document.getElementById('impfile').click();
    else if(d.bk==='cancel'){IMP=null;render()}
    else if(d.bk==='apply'&&IMP){const old=JSON.stringify(S);S=IMP.data;IMP=null;save();render();toast('Datos importados',()=>{S=JSON.parse(old);save();render()})}
  }
  else if(d.batch) openReg({mode:'many',sid:d.batch,sids:[d.batch]});
  else if(d.day){SEL=d.day;render()}
  else if(d.wk){WEEK=addDays(WEEK,7*+d.wk);SEL=dkey(WEEK);render()}
  else if('clearEx' in d){const s0=snap();S.marks={};S.videos=S.videos.filter(v=>!v.ex);S.ex=false;save();render();toast('Datos de ejemplo borrados',()=>{S.ex=true;restore(s0)()})}
  else if(d.skind){const [id,k]=d.skind.split('|');ser(id).kind=k;save();render()}
  else if(d.snet){const [id,n]=d.snet.split('|');const s=ser(id);if(s.nets.includes(n)){if(s.nets.length===1){toast('Cada serie necesita al menos una red');return}s.nets=s.nets.filter(x=>x!==n)}else s.nets=NK.filter(x=>x===n||s.nets.includes(x));save();render()}
  else if(d.sday){const [id,i]=d.sday.split('|');const s=ser(id);const n=+i;if(s.days.includes(n)){if(s.days.length===1){toast('Elige al menos un día');return}s.days=s.days.filter(x=>x!==n)}else s.days=[...s.days,n].sort();save();render()}
  else if(d.srmt){const [id,t]=d.srmt.split('|');const s=ser(id);if(s.times.length===1){toast('Deja al menos una hora');return}s.times=s.times.filter(x=>x!==t);save();render()}
  else if(d.sdel){if(DEL!==d.sdel){DEL=d.sdel;render();return}const i=S.series.findIndex(s=>s.id===d.sdel);const old=S.series[i];S.series.splice(i,1);DEL=null;save();render();toast('Serie eliminada',()=>{S.series.splice(i,0,old);save();render()})}
  else if('addseries' in d){S.series.push({id:uid(),name:'Nueva cuenta',kind:'corto',nets:['tt'],days:[0,1,2,3,4,5,6],times:['09:00']});save();render();const ins=V.querySelectorAll('.inp.name');const last=ins[ins.length-1];last.focus();last.select()}
});
V.addEventListener('input',e=>{if(e.target.id==='vq'){VQ=e.target.value;drawVList()}});
V.addEventListener('change',e=>{if(e.target.dataset.sname){const s=ser(e.target.dataset.sname);const v=e.target.value.trim();if(v){s.name=v;save()}}});
V.addEventListener('submit',e=>{const f=e.target.closest('[data-saddt]');if(!f)return;e.preventDefault();const s=ser(f.dataset.saddt);const v=f.querySelector('input').value;if(v&&!s.times.includes(v)){s.times=[...s.times,v].sort();save();render();toast('Hora agregada: '+fT(v))}});

go(location.hash.slice(1)||'hoy');
document.getElementById('impfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)readImport(f);e.target.value=''});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(!sheetSlot.open&&!sheetReg.open&&!sheetVid.open&&document.activeElement?.id!=='vq')render()},60000);
</script>
